; Mocha islands — geometry is supplied by i3-polybar for the active monitor.
[colors]
background = #1e1e2e
foreground = #cdd6f4
muted = #9399b2
surface = #313244
border = #45475a
green = #a6e3a1
yellow = #f9e2af
pink = #f5c2e7
accent = #89b4fa

[bar/base]
monitor = ${env:MONITOR:}
height = 36
offset-y = 10
radius = 12
border-size = 1
border-color = ${colors.border}
bottom = false
line-size = 2
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Fira Code:size=9;2
font-1 = FontAwesome:size=11;2
font-2 = DejaVu Sans:size=9;2
padding = 2
module-margin = 5px
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize
override-redirect = true
wm-restack = i3

; i3 stacks managed docks vertically. Reserve space exactly once, then float
; the three visible islands in that space.
[bar/reserve]
monitor = ${env:MONITOR:}
width = 100%
height = 56
background = #00000000
foreground = #00000000
font-0 = Fira Code:size=9;2
modules-left = spacer

[module/spacer]
type = custom/text
format = " "

[bar/workspaces]
inherit = bar/base
width = ${env:LEFT_WIDTH:380}
offset-x = 12
modules-left = launcher clipboard screenshot i3
modules-right = window

[bar/media]
inherit = bar/base
width = ${env:CENTER_WIDTH:560}
offset-x = ${env:CENTER_X:404}
modules-center = previous playback next song divider time

[bar/status]
inherit = bar/base
width = ${env:RIGHT_WIDTH:520}
offset-x = ${env:RIGHT_X:976}
modules-right = ${env:STATUS_MODULES:cpu memory temperature brightness volume battery divider controls}

[module/launcher]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.accent}
click-left = rofi -show drun
click-right = rofi -show window

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
label-focused = %name%
label-focused-background = ${colors.surface}
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.muted}
label-visible = %name%
label-visible-padding = 1
label-visible-foreground = ${colors.foreground}
label-urgent = %name%
label-urgent-foreground = #f38ba8
label-urgent-padding = 1

[module/window]
type = internal/xwindow
label = %title%
label-maxlen = ${env:WINDOW_CHARS:20}
label-ellipsis = true
label-foreground = ${colors.muted}
label-empty = Desktop

[module/previous]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.muted}
click-left = ~/.local/bin/i3-media previous

[module/playback]
type = custom/script
exec = ~/.local/bin/i3-media watch icon
tail = true
format-font = 2
format-foreground = ${colors.green}
click-left = ~/.local/bin/i3-media play-pause
click-right = ~/.local/bin/i3-media stop

[module/next]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.muted}
click-left = ~/.local/bin/i3-media next

[module/song]
type = custom/script
exec = ~/.local/bin/i3-media watch title
tail = true
format-foreground = ${colors.green}
click-left = ~/.local/bin/i3-media play-pause

[module/divider]
type = custom/text
format = │
format-foreground = ${colors.border}
format-padding = 1

[module/time]
type = internal/date
interval = 1
date = %a %d
time = %H:%M
label = %{A1:~/.local/bin/i3-calendar:}%date%  %time%%{A}
label-foreground = ${colors.foreground}

[module/metric]
type = custom/script
format-padding = 0

[module/cpu]
inherit = module/metric
exec = env BLOCK_NAME=cpu BAR_COMPACT=1 ~/.local/bin/i3-status
interval = 5
format-foreground = ${colors.accent}

[module/memory]
inherit = module/metric
exec = env BLOCK_NAME=memory BAR_COMPACT=1 ~/.local/bin/i3-status
interval = 15
format-foreground = ${colors.muted}

[module/temperature]
inherit = module/metric
exec = env BLOCK_NAME=temperature BAR_COMPACT=1 ~/.local/bin/i3-status
interval = 15
format-foreground = ${colors.yellow}

[module/brightness]
inherit = module/metric
exec = env BLOCK_NAME=brightness BAR_COMPACT=1 ~/.local/bin/i3-status
interval = 15
format-foreground = ${colors.yellow}
scroll-up = ~/.local/bin/i3-control brightness-up
scroll-down = ~/.local/bin/i3-control brightness-down

[module/volume]
inherit = module/metric
exec = env BLOCK_NAME=volume BAR_COMPACT=1 ~/.local/bin/i3-status
interval = 3
format-foreground = ${colors.pink}
click-left = pavucontrol --tab=3
click-right = ~/.local/bin/i3-control mute
scroll-up = ~/.local/bin/i3-control volume-up
scroll-down = ~/.local/bin/i3-control volume-down

[module/battery]
inherit = module/metric
exec = env BLOCK_NAME=battery BAR_COMPACT=1 ~/.local/bin/i3-status
interval = 30
format-foreground = ${colors.green}

[module/controls]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.accent}
click-left = ~/.local/bin/i3-center

[module/clipboard]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.pink}
click-left = copyq toggle

[module/screenshot]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.accent}
click-left = flameshot gui
