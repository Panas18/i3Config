[colors]
background = #1e1e2e
foreground = #cdd6f4
muted = #6c7086
accent = #89b4fa

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Fira Code:size=10;2
font-1 = Noto Color Emoji:scale=10;2
font-2 = DejaVu Sans:size=10;2
font-3 = FontAwesome:size=11;2
padding-left = 1
padding-right = 1
module-margin = 1
modules-left = i3
modules-right = network battery volume brightness temperature cpu memory disk bluetooth bandwidth time controls tray
enable-ipc = true
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
label-focused = %name%
label-focused-background = #313244
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-padding = 1

[module/network]
type = custom/script
exec = env BLOCK_NAME=network ~/.local/bin/i3-status
interval = 5
click-left = nm-connection-editor

[module/battery]
type = custom/script
exec = env BLOCK_NAME=battery ~/.local/bin/i3-status
interval = 15

[module/volume]
type = custom/script
exec = env BLOCK_NAME=volume ~/.local/bin/i3-status
interval = 2
click-left = pavucontrol --tab=3
click-right = ~/.local/bin/i3-control mute
scroll-up = ~/.local/bin/i3-control volume-up
scroll-down = ~/.local/bin/i3-control volume-down

[module/brightness]
type = custom/script
exec = env BLOCK_NAME=brightness ~/.local/bin/i3-status
interval = 2
scroll-up = ~/.local/bin/i3-control brightness-up
scroll-down = ~/.local/bin/i3-control brightness-down

[module/temperature]
type = custom/script
exec = env BLOCK_NAME=temperature ~/.local/bin/i3-status
interval = 10

[module/cpu]
type = custom/script
exec = env BLOCK_NAME=cpu ~/.local/bin/i3-status
interval = 3

[module/memory]
type = custom/script
exec = env BLOCK_NAME=memory ~/.local/bin/i3-status
interval = 5

[module/disk]
type = custom/script
exec = env BLOCK_NAME=disk ~/.local/bin/i3-status
interval = 30

[module/bluetooth]
type = custom/script
exec = env BLOCK_NAME=bluetooth ~/.local/bin/i3-status
interval = 10
click-left = blueman-manager

[module/bandwidth]
type = custom/script
exec = env BLOCK_NAME=bandwidth ~/.local/bin/i3-status
interval = 2
click-left = nm-connection-editor

[module/time]
type = custom/script
exec = env BLOCK_NAME=time ~/.local/bin/i3-status
interval = 1
click-left = zenity --calendar --title=Calendar --text="Select a date" --ok-label=Close

[module/controls]
type = custom/text
format = ☰
format-foreground = ${colors.accent}
click-left = ~/.local/bin/i3-center
click-right = ~/.local/bin/i3-power-menu

[module/tray]
type = internal/tray
tray-size = 18
tray-spacing = 6
