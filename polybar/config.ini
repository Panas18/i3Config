[colors]
background = #1e1e2e
foreground = #cdd6f4
muted = #a6adc8
surface = #26283b
green = #a6e3a1
yellow = #f9e2af
pink = #f5c2e7
accent = #89b4fa

[bar/main]
monitor = ${env:MONITOR:}
width = 100%:-24
height = 40
offset-x = 12
offset-y = 8
radius = 12
border-size = 1
border-color = #45475a
bottom = false
line-size = 2
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Fira Code:size=10;2
font-1 = Noto Color Emoji:scale=10;2
font-2 = DejaVu Sans:size=10;2
font-3 = FontAwesome:size=11;2
padding-left = 1
padding-right = 1
module-margin = 3px
modules-left = launcher i3
modules-right = network battery volume brightness temperature cpu memory disk bluetooth bandwidth time controls tray
enable-ipc = true
cursor-click = pointer

[module/launcher]
type = custom/text
format = 
format-font = 4
format-foreground = #1e1e2e
format-background = ${colors.accent}
format-padding = 2
click-left = rofi -show drun
click-right = ~/.local/bin/i3-power-menu

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
label-focused = %name%
label-focused-background = #45475a
label-focused-foreground = #cdd6f4
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.muted}
label-visible = %name%
label-visible-padding = 1
label-visible-background = ${colors.surface}
label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-padding = 1

[module/network]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.accent}
format-padding = 1
exec = env BLOCK_NAME=network ~/.local/bin/i3-status
interval = 5
click-left = nm-connection-editor

[module/battery]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.green}
format-padding = 1
exec = env BLOCK_NAME=battery ~/.local/bin/i3-status
interval = 15

[module/volume]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.pink}
format-padding = 1
exec = env BLOCK_NAME=volume ~/.local/bin/i3-status
interval = 2
click-left = pavucontrol --tab=3
click-right = ~/.local/bin/i3-control mute
scroll-up = ~/.local/bin/i3-control volume-up
scroll-down = ~/.local/bin/i3-control volume-down

[module/brightness]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.yellow}
format-padding = 1
exec = env BLOCK_NAME=brightness ~/.local/bin/i3-status
interval = 2
scroll-up = ~/.local/bin/i3-control brightness-up
scroll-down = ~/.local/bin/i3-control brightness-down

[module/temperature]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.yellow}
format-padding = 1
exec = env BLOCK_NAME=temperature ~/.local/bin/i3-status
interval = 10

[module/cpu]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.accent}
format-padding = 1
exec = env BLOCK_NAME=cpu ~/.local/bin/i3-status
interval = 3

[module/memory]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.pink}
format-padding = 1
exec = env BLOCK_NAME=memory ~/.local/bin/i3-status
interval = 5

[module/disk]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.green}
format-padding = 1
exec = env BLOCK_NAME=disk ~/.local/bin/i3-status
interval = 30

[module/bluetooth]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.accent}
format-padding = 1
exec = env BLOCK_NAME=bluetooth ~/.local/bin/i3-status
interval = 10
click-left = blueman-manager

[module/bandwidth]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.muted}
format-padding = 1
exec = env BLOCK_NAME=bandwidth ~/.local/bin/i3-status
interval = 2
click-left = nm-connection-editor

[module/time]
type = custom/script
format-background = ${colors.surface}
format-foreground = ${colors.foreground}
format-padding = 1
exec = env BLOCK_NAME=time ~/.local/bin/i3-status
interval = 1
click-left = zenity --calendar --title=Calendar --text="Select a date" --ok-label=Close

[module/controls]
type = custom/text
format = 
format-font = 4
format-background = ${colors.accent}
format-foreground = #1e1e2e
format-padding = 2
click-left = ~/.local/bin/i3-center
click-right = ~/.local/bin/i3-power-menu

[module/tray]
type = internal/tray
tray-size = 18
tray-spacing = 6
format-background = ${colors.surface}
format-padding = 1
