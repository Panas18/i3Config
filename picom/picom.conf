# GLX supports accelerated compositing on the Intel/Mesa X11 session.
backend = "glx";
use-damage = true;
unredir-if-possible = false;
vsync = true;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.26;
shadow-offset-x = -9;
shadow-offset-y = -9;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
corner-radius = 10;
active-opacity = 1.0;
inactive-opacity = 1.0;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'", "fullscreen", "class_g = 'flameshot'", "class_g = 'Flameshot'"];
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'", "fullscreen", "class_g = 'Polybar'", "class_g = 'flameshot'", "class_g = 'Flameshot'"];

# Keep GTK menus and the quick-settings panel opaque and readable.
wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; };
  dock = { shadow = false; };
  desktop = { shadow = false; };
};

# Do not animate the screenshot selection overlay.
fade-exclude = ["class_g = 'flameshot'", "class_g = 'Flameshot'"];
