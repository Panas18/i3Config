backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.22;
shadow-offset-x = -6;
shadow-offset-y = -6;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
corner-radius = 8;
active-opacity = 1.0;
inactive-opacity = 1.0;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'"];
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'", "fullscreen"];
