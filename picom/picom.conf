# GLX supports accelerated compositing on the Intel/Mesa X11 session.
backend = "glx";
use-damage = true;
unredir-if-possible = false;
vsync = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.18;
shadow-offset-x = -6;
shadow-offset-y = -6;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
corner-radius = 10;
active-opacity = 1.0;
inactive-opacity = 1.0;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'"];
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'", "fullscreen", "class_g = 'Polybar'"];

# Keep GTK menus and the quick-settings panel opaque and readable.
wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; };
  dock = { shadow = false; };
  desktop = { shadow = false; };
};
