[dmenu]
dmenu_command = rofi -i -theme settings
active_chars = ●
highlight = True
compact = True
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
list_saved = False
prompt = Wi-Fi & network

[dmenu_passphrase]
obscure = True

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 3
notification_timeout = 4
show_notifications = True
