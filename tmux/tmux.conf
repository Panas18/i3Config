set -g default-shell /bin/zsh
#configs setw -g mouse on
setw -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'

# List of plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Open new windows/panes in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Theme switching: prefix + Shift+T cycles Mocha, Gruvbox and Nord.
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60
source-file ~/.config/tmux/themes/mocha.conf
bind T if-shell -F '#{==:#{@i3config_theme},mocha}' 'source-file ~/.config/tmux/themes/gruvbox.conf' 'if-shell -F "#{==:#{@i3config_theme},gruvbox}" "source-file ~/.config/tmux/themes/nord.conf" "source-file ~/.config/tmux/themes/mocha.conf"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell -b "$HOME/.tmux/plugins/tpm/tpm"
