# Mocha palette; plain text works without patched fonts.
set -g @i3config_theme mocha
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g message-style 'bg=#89b4fa,fg=#1e1e2e'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#a6e3a1'
set -g mode-style 'bg=#89b4fa,fg=#1e1e2e'
set -g status-left '#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] '
set -g status-right '#[fg=#a6e3a1]#{b:pane_current_path} #[fg=#89b4fa] %H:%M '
set -g window-status-format '#[fg=#cdd6f4] #I:#W '
set -g window-status-current-format '#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W #[default]'
