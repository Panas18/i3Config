# Gruvbox palette; plain text works without patched fonts.
set -g @i3config_theme gruvbox
set -g status-style 'bg=#282828,fg=#ebdbb2'
set -g message-style 'bg=#83a598,fg=#282828'
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#b8bb26'
set -g mode-style 'bg=#83a598,fg=#282828'
set -g status-left '#[bg=#d3869b,fg=#282828,bold] #S #[default] '
set -g status-right '#[fg=#b8bb26]#{b:pane_current_path} #[fg=#83a598] %H:%M '
set -g window-status-format '#[fg=#ebdbb2] #I:#W '
set -g window-status-current-format '#[bg=#83a598,fg=#282828,bold] #I:#W #[default]'
