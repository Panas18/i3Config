# Nord palette; plain text works without patched fonts.
set -g @i3config_theme nord
set -g status-style 'bg=#2e3440,fg=#eceff4'
set -g message-style 'bg=#88c0d0,fg=#2e3440'
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#a3be8c'
set -g mode-style 'bg=#88c0d0,fg=#2e3440'
set -g status-left '#[bg=#b48ead,fg=#2e3440,bold] #S #[default] '
set -g status-right '#[fg=#a3be8c]#{b:pane_current_path} #[fg=#88c0d0] %H:%M '
set -g window-status-format '#[fg=#eceff4] #I:#W '
set -g window-status-current-format '#[bg=#88c0d0,fg=#2e3440,bold] #I:#W #[default]'
